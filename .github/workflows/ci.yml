name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Price rules
        run: node --test api/pricing.test.js
      - name: Build client
        working-directory: client
        run: |
          npm install
          npm run build
