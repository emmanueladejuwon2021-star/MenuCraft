name: Deploy Note

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment reminder
        run: |
          echo "MenuCraft is a PHP + SQLite application."
          echo "GitHub Pages cannot run PHP backends."
          echo "Deploy to Vercel (with vercel-php), Render, Railway, a VPS, or any PHP 8.1+ host with PDO SQLite."
          echo "See README.md for details."
